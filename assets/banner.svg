<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFE81F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFE81F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bgGrad)"/>
  <rect width="900" height="220" fill="url(#glow)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.4" opacity="0.8"/>
    <circle cx="90" cy="70" r="1" opacity="0.6"/>
    <circle cx="150" cy="20" r="1.6" opacity="0.9"/>
    <circle cx="210" cy="60" r="1" opacity="0.5"/>
    <circle cx="260" cy="15" r="1.2" opacity="0.7"/>
    <circle cx="60" cy="150" r="1.3" opacity="0.6"/>
    <circle cx="120" cy="190" r="1" opacity="0.5"/>
    <circle cx="700" cy="25" r="1.5" opacity="0.8"/>
    <circle cx="760" cy="60" r="1" opacity="0.6"/>
    <circle cx="820" cy="15" r="1.3" opacity="0.7"/>
    <circle cx="860" cy="80" r="1.6" opacity="0.9"/>
    <circle cx="780" cy="150" r="1" opacity="0.5"/>
    <circle cx="830" cy="190" r="1.2" opacity="0.6"/>
    <circle cx="650" cy="180" r="1" opacity="0.5"/>
    <circle cx="600" cy="30" r="1.1" opacity="0.6"/>
    <circle cx="340" cy="200" r="1" opacity="0.5"/>
    <circle cx="450" cy="10" r="1.3" opacity="0.7"/>
    <circle cx="500" cy="195" r="1" opacity="0.5"/>
  </g>

  <!-- generic starship silhouette (original shape, not an official design) -->
  <g transform="translate(60,150)" fill="#e8e8e8" opacity="0.85">
    <path d="M0,10 L60,0 L110,6 L140,10 L110,14 L60,20 Z"/>
    <path d="M40,10 L20,-6 L30,10 L20,26 Z" opacity="0.7"/>
    <circle cx="118" cy="10" r="2.2" fill="#FFE81F"/>
  </g>
  <g transform="translate(760,60) scale(-1,1)" fill="#e8e8e8" opacity="0.6">
    <path d="M0,8 L45,0 L82,5 L105,8 L82,11 L45,16 Z"/>
    <circle cx="88" cy="8" r="1.6" fill="#FFE81F"/>
  </g>

  <!-- title -->
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="46" fill="#FFE81F" letter-spacing="4">
    STAR WARS EXPLORER
  </text>
  <text x="450" y="140" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#c9c9c9" letter-spacing="1">
    A long time ago, in a codebase far, far away...
  </text>
</svg>
